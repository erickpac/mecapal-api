version: 1.0
runtime: nodejs18
build:
  commands:
    pre-build:
      - corepack enable
      - corepack prepare pnpm@latest --activate
    build:
      - pnpm install --frozen-lockfile
      - pnpm prisma generate
      - pnpm build
run:
  command: node dist/main
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
