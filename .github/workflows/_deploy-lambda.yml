name: Deploy Cognito Lambda

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (development/production)'
        required: true
        type: string
      function_name:
        description: 'Lambda function name'
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy-lambda:
    name: Deploy Cognito Lambda (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    concurrency:
      group: deploy-lambda-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lambda unit tests
        run: pnpm test:lambda

      - name: Build Lambda bundle
        run: pnpm build:lambda:cognito

      - name: Package bundle
        run: |
          cd lambdas/cognito-custom-message/dist
          zip -j function.zip index.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ inputs.function_name }} \
            --zip-file fileb://lambdas/cognito-custom-message/dist/function.zip \
            --region ${{ env.AWS_REGION }} \
            --publish

      - name: Deployment summary
        run: |
          echo "## Cognito Lambda Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Function: \`${{ inputs.function_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: \`${{ inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
