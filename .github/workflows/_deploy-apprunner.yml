name: Deploy to App Runner

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (development/production)'
        required: true
        type: string
      service_name:
        description: 'App Runner service name'
        required: true
        type: string
      ecr_repository:
        description: 'ECR repository name'
        required: true
        type: string
      node_env:
        description: 'NODE_ENV value'
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      APP_RUNNER_ECR_ROLE_ARN:
        required: true
      DATABASE_URL:
        required: true
      AWS_COGNITO_USER_POOL_ID:
        required: true
      AWS_COGNITO_CLIENT_ID:
        required: true
      AWS_S3_BUCKET:
        required: true
      APP_AWS_ACCESS_KEY_ID:
        required: true
      APP_AWS_SECRET_ACCESS_KEY:
        required: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    # Prevent concurrent deployments to the same environment
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    outputs:
      service_url: ${{ steps.get-url.outputs.service_url }}
      image_tag: ${{ steps.build-image.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "::group::Running Prisma migrations"
          pnpm prisma migrate deploy
          echo "::endgroup::"
          echo "::notice::Migrations applied successfully"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "full_image=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check if App Runner service exists
        id: check-service
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ inputs.service_name }}'].ServiceArn" \
            --output text)

          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
            echo "::notice::Service exists: $SERVICE_ARN"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Service does not exist, will create new one"
          fi

      - name: Create App Runner service
        if: steps.check-service.outputs.exists == 'false'
        id: create-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          SERVICE_NAME: ${{ inputs.service_name }}
          NODE_ENV: ${{ inputs.node_env }}
        run: |
          # Create source configuration JSON
          SOURCE_CONFIG=$(cat <<EOF
          {
            "ImageRepository": {
              "ImageIdentifier": "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8080",
                "RuntimeEnvironmentVariables": {
                  "NODE_ENV": "${NODE_ENV}",
                  "PORT": "8080",
                  "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
                  "AWS_REGION": "${{ env.AWS_REGION }}",
                  "AWS_COGNITO_USER_POOL_ID": "${{ secrets.AWS_COGNITO_USER_POOL_ID }}",
                  "AWS_COGNITO_CLIENT_ID": "${{ secrets.AWS_COGNITO_CLIENT_ID }}",
                  "AWS_S3_BUCKET": "${{ secrets.AWS_S3_BUCKET }}",
                  "AWS_S3_REGION": "${{ env.AWS_REGION }}",
                  "AWS_ACCESS_KEY_ID": "${{ secrets.APP_AWS_ACCESS_KEY_ID }}",
                  "AWS_SECRET_ACCESS_KEY": "${{ secrets.APP_AWS_SECRET_ACCESS_KEY }}"
                }
              }
            },
            "AutoDeploymentsEnabled": false,
            "AuthenticationConfiguration": {
              "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}"
            }
          }
          EOF
          )

          SERVICE_ARN=$(aws apprunner create-service \
            --service-name "$SERVICE_NAME" \
            --source-configuration "$SOURCE_CONFIG" \
            --instance-configuration '{"Cpu": "512", "Memory": "1024"}' \
            --health-check-configuration '{"Protocol": "HTTP", "Path": "/api/health", "Interval": 10, "Timeout": 5, "HealthyThreshold": 1, "UnhealthyThreshold": 5}' \
            --query 'Service.ServiceArn' \
            --output text)

          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          echo "::notice::Created service: $SERVICE_ARN"

      - name: Update App Runner service
        if: steps.check-service.outputs.exists == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          SERVICE_ARN: ${{ steps.check-service.outputs.service_arn }}
          NODE_ENV: ${{ inputs.node_env }}
        run: |
          # Create source configuration JSON
          SOURCE_CONFIG=$(cat <<EOF
          {
            "ImageRepository": {
              "ImageIdentifier": "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8080",
                "RuntimeEnvironmentVariables": {
                  "NODE_ENV": "${NODE_ENV}",
                  "PORT": "8080",
                  "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
                  "AWS_REGION": "${{ env.AWS_REGION }}",
                  "AWS_COGNITO_USER_POOL_ID": "${{ secrets.AWS_COGNITO_USER_POOL_ID }}",
                  "AWS_COGNITO_CLIENT_ID": "${{ secrets.AWS_COGNITO_CLIENT_ID }}",
                  "AWS_S3_BUCKET": "${{ secrets.AWS_S3_BUCKET }}",
                  "AWS_S3_REGION": "${{ env.AWS_REGION }}",
                  "AWS_ACCESS_KEY_ID": "${{ secrets.APP_AWS_ACCESS_KEY_ID }}",
                  "AWS_SECRET_ACCESS_KEY": "${{ secrets.APP_AWS_SECRET_ACCESS_KEY }}"
                }
              }
            },
            "AutoDeploymentsEnabled": false,
            "AuthenticationConfiguration": {
              "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}"
            }
          }
          EOF
          )

          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "$SOURCE_CONFIG"

          echo "::notice::Updated service: $SERVICE_ARN"

      - name: Resolve service ARN
        id: resolve-arn
        run: |
          if [ "${{ steps.check-service.outputs.exists }}" == "true" ]; then
            echo "service_arn=${{ steps.check-service.outputs.service_arn }}" >> $GITHUB_OUTPUT
          else
            echo "service_arn=${{ steps.create-service.outputs.service_arn }}" >> $GITHUB_OUTPUT
          fi

      - name: Wait for deployment
        id: wait-deploy
        env:
          SERVICE_ARN: ${{ steps.resolve-arn.outputs.service_arn }}
        run: |
          echo "::group::Waiting for deployment to complete"
          echo "Service ARN: $SERVICE_ARN"

          # Use AWS waiter with timeout
          if aws apprunner wait service-running --service-arn "$SERVICE_ARN"; then
            echo "::endgroup::"
            echo "success=true" >> $GITHUB_OUTPUT
            echo "::notice::Deployment completed successfully!"
          else
            echo "::endgroup::"
            echo "success=false" >> $GITHUB_OUTPUT
            echo "::error::Deployment failed or timed out"
            exit 1
          fi

      - name: Get service URL
        id: get-url
        env:
          SERVICE_ARN: ${{ steps.resolve-arn.outputs.service_arn }}
        run: |
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" \
            --query 'Service.ServiceUrl' \
            --output text)

          echo "service_url=https://$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "::notice::Service URL: https://$SERVICE_URL"

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Deployment Summary

          | Property | Value |
          |----------|-------|
          | Environment | \`${{ inputs.environment }}\` |
          | Service | \`${{ inputs.service_name }}\` |
          | Image Tag | \`${{ steps.meta.outputs.image_tag }}\` |
          | Service URL | ${{ steps.get-url.outputs.service_url }} |
          | Commit | \`${{ github.sha }}\` |
          | Triggered by | @${{ github.actor }} |

          ### Health Check
          - **Path:** \`/api/health\`
          - **Status:** Passing
          EOF
