name: Deploy to App Runner

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (development/production)'
        required: true
        type: string
      service_name:
        description: 'App Runner service name'
        required: true
        type: string
      ecr_repository:
        description: 'ECR repository name'
        required: true
        type: string
      node_env:
        description: 'NODE_ENV value'
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      APP_RUNNER_ECR_ROLE_ARN:
        required: true
      DATABASE_URL:
        required: true
      AWS_COGNITO_USER_POOL_ID:
        required: true
      AWS_COGNITO_CLIENT_ID:
        required: true
      AWS_S3_BUCKET:
        required: true
      APP_AWS_ACCESS_KEY_ID:
        required: true
      APP_AWS_SECRET_ACCESS_KEY:
        required: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    outputs:
      service_url: ${{ steps.get-url.outputs.service_url }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "::group::Running Prisma migrations"
          pnpm prisma migrate deploy
          echo "::endgroup::"
          echo "::notice::Migrations applied successfully"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get App Runner service ARN
        id: get-service
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${{ inputs.service_name }}'].ServiceArn" \
            --output text)

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" == "None" ]; then
            echo "::error::App Runner service '${{ inputs.service_name }}' not found."
            echo "::error::Please create the service first using infrastructure scripts."
            exit 1
          fi

          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          echo "::notice::Found service: $SERVICE_ARN"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "full_image=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update App Runner service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          SERVICE_ARN: ${{ steps.get-service.outputs.service_arn }}
          NODE_ENV: ${{ inputs.node_env }}
        run: |
          SOURCE_CONFIG=$(cat <<EOF
          {
            "ImageRepository": {
              "ImageIdentifier": "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8080",
                "RuntimeEnvironmentVariables": {
                  "NODE_ENV": "${NODE_ENV}",
                  "PORT": "8080",
                  "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
                  "AWS_REGION": "${{ env.AWS_REGION }}",
                  "AWS_COGNITO_USER_POOL_ID": "${{ secrets.AWS_COGNITO_USER_POOL_ID }}",
                  "AWS_COGNITO_CLIENT_ID": "${{ secrets.AWS_COGNITO_CLIENT_ID }}",
                  "AWS_S3_BUCKET": "${{ secrets.AWS_S3_BUCKET }}",
                  "AWS_S3_REGION": "${{ env.AWS_REGION }}",
                  "AWS_ACCESS_KEY_ID": "${{ secrets.APP_AWS_ACCESS_KEY_ID }}",
                  "AWS_SECRET_ACCESS_KEY": "${{ secrets.APP_AWS_SECRET_ACCESS_KEY }}"
                }
              }
            },
            "AutoDeploymentsEnabled": false,
            "AuthenticationConfiguration": {
              "AccessRoleArn": "${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}"
            }
          }
          EOF
          )

          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "$SOURCE_CONFIG"

          echo "::notice::Updated service: $SERVICE_ARN"

      - name: Wait for deployment
        env:
          SERVICE_ARN: ${{ steps.get-service.outputs.service_arn }}
        run: |
          echo "::group::Waiting for deployment to complete"
          echo "Service ARN: $SERVICE_ARN"

          MAX_ATTEMPTS=60
          SLEEP_TIME=10

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query 'Service.Status' \
              --output text)

            echo "Attempt $i/$MAX_ATTEMPTS: Status = $STATUS"

            if [ "$STATUS" = "RUNNING" ]; then
              echo "::endgroup::"
              echo "::notice::Deployment completed successfully!"
              exit 0
            elif [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ] || [ "$STATUS" = "UPDATE_FAILED" ]; then
              echo "::endgroup::"
              echo "::error::Deployment failed with status: $STATUS"
              exit 1
            fi

            sleep $SLEEP_TIME
          done

          echo "::endgroup::"
          echo "::error::Deployment timed out after $((MAX_ATTEMPTS * SLEEP_TIME)) seconds"
          exit 1

      - name: Get service URL
        id: get-url
        env:
          SERVICE_ARN: ${{ steps.get-service.outputs.service_arn }}
        run: |
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" \
            --query 'Service.ServiceUrl' \
            --output text)

          echo "service_url=https://$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "::notice::Service URL: https://$SERVICE_URL"

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Deployment Summary

          | Property | Value |
          |----------|-------|
          | Environment | \`${{ inputs.environment }}\` |
          | Service | \`${{ inputs.service_name }}\` |
          | Image Tag | \`${{ steps.meta.outputs.image_tag }}\` |
          | Service URL | ${{ steps.get-url.outputs.service_url }} |
          | Commit | \`${{ github.sha }}\` |
          | Triggered by | @${{ github.actor }} |

          ### Health Check
          - **Path:** \`/api/health\`
          - **Status:** Passing
          EOF
