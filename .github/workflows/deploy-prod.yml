name: Deploy to Production

on:
  push:
    branches: [main]
    # Only redeploy the API when its build inputs change. Docs, the Cognito
    # Lambda, infra scripts/policies and their workflows deploy separately (or
    # not at all), so they should not trigger a full ECS redeploy + migrations.
    paths-ignore:
      - 'docs/**'
      - 'lambdas/**'
      - 'infrastructure/**'
      - '.github/workflows/_deploy-lambda.yml'
      - '.github/workflows/deploy-lambda-dev.yml'
      - '.github/workflows/deploy-lambda-prod.yml'
      - '**/*.md'
      - '.claude/**'

jobs:
  deploy:
    name: Deploy to Prod
    uses: ./.github/workflows/_deploy-ecs-express.yml
    with:
      environment: production
      service_name: mekapal-api-prod
      ecr_repository: mekapal-api-prod
      node_env: production
      cpu: '1024'
      memory: '2048'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECS_EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
      ECS_INFRASTRUCTURE_ROLE_ARN: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
      ECS_TASK_ROLE_ARN: ${{ secrets.ECS_TASK_ROLE_ARN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_COGNITO_USER_POOL_ID: ${{ secrets.AWS_COGNITO_USER_POOL_ID }}
      AWS_COGNITO_CLIENT_ID: ${{ secrets.AWS_COGNITO_CLIENT_ID }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_CLOUDFRONT_DOMAIN: ${{ secrets.AWS_CLOUDFRONT_DOMAIN }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
