name: Deploy to ECS Express Mode

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (development/production)'
        required: true
        type: string
      service_name:
        description: 'ECS Express service name'
        required: true
        type: string
      ecr_repository:
        description: 'ECR repository name'
        required: true
        type: string
      node_env:
        description: 'NODE_ENV value'
        required: true
        type: string
      cpu:
        description: 'CPU units (256-16384)'
        required: false
        type: string
        default: '512'
      memory:
        description: 'Memory in MB'
        required: false
        type: string
        default: '1024'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      ECS_EXECUTION_ROLE_ARN:
        required: true
      ECS_INFRASTRUCTURE_ROLE_ARN:
        required: true
      ECS_TASK_ROLE_ARN:
        required: true
      DATABASE_URL:
        required: true
      AWS_COGNITO_USER_POOL_ID:
        required: true
      AWS_COGNITO_CLIENT_ID:
        required: true
      AWS_S3_BUCKET:
        required: true
      AWS_CLOUDFRONT_DOMAIN:
        required: true
      CORS_ORIGIN:
        required: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    outputs:
      service_url: ${{ steps.deploy-ecs.outputs.service-url }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "full_image=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run Prisma migrations as a one-off ECS task inside the VPC, so it can
      # reach the now-private RDS. Runs before the service is updated; a
      # non-zero container exit code fails the deploy.
      - name: Run database migrations (in-VPC ECS task)
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.meta.outputs.image_tag }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXECUTION_ROLE_ARN: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          TASK_ROLE_ARN: ${{ secrets.ECS_TASK_ROLE_ARN }}
          MIGRATION_SUBNET: subnet-0582235ac8cb7e758
          MIGRATION_SG: sg-04e2b769e3fa167a4
          LOG_GROUP: /aws/ecs/default/mekapal-api-${{ inputs.environment == 'production' && 'prod' || 'dev' }}-migrate
        run: |
          set -euo pipefail

          aws logs create-log-group --log-group-name "$LOG_GROUP" 2>/dev/null || true

          # Register a one-off migration task def: new image, command override,
          # DATABASE_URL passed straight through (private RDS, in-VPC).
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --family mekapal-api-${{ inputs.environment }}-migrate \
            --requires-compatibilities FARGATE \
            --network-mode awsvpc \
            --cpu 256 --memory 512 \
            --execution-role-arn "$EXECUTION_ROLE_ARN" \
            --task-role-arn "$TASK_ROLE_ARN" \
            --container-definitions "$(cat <<JSON
          [
            {
              "name": "migrate",
              "image": "${IMAGE}",
              "essential": true,
              "command": ["node_modules/.bin/prisma", "migrate", "deploy"],
              "environment": [{ "name": "DATABASE_URL", "value": "${DATABASE_URL}" }],
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "${LOG_GROUP}",
                  "awslogs-region": "${AWS_REGION}",
                  "awslogs-stream-prefix": "migrate"
                }
              }
            }
          ]
          JSON
          )" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $TASK_DEF_ARN"

          TASK_ARN=$(aws ecs run-task \
            --cluster default \
            --launch-type FARGATE \
            --task-definition "$TASK_DEF_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[$MIGRATION_SUBNET],securityGroups=[$MIGRATION_SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started migration task $TASK_ARN"

          aws ecs wait tasks-stopped --cluster default --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster default --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks --cluster default --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Migration task exit code: $EXIT_CODE (reason: $STOP_REASON)"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task failed (exit $EXIT_CODE). Aborting deploy."
            exit 1
          fi
          echo "::notice::Migrations applied successfully"

      - name: Deploy to ECS Express Mode
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ inputs.service_name }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.meta.outputs.image_tag }}
          execution-role-arn: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
          task-role-arn: ${{ secrets.ECS_TASK_ROLE_ARN }}
          container-port: 8080
          health-check-path: /api/health
          cpu: ${{ inputs.cpu }}
          memory: ${{ inputs.memory }}
          environment-variables: >-
            [
              {"name": "NODE_ENV", "value": "${{ inputs.node_env }}"},
              {"name": "PORT", "value": "8080"},
              {"name": "DATABASE_URL", "value": "${{ secrets.DATABASE_URL }}"},
              {"name": "AWS_REGION", "value": "${{ env.AWS_REGION }}"},
              {"name": "AWS_COGNITO_USER_POOL_ID", "value": "${{ secrets.AWS_COGNITO_USER_POOL_ID }}"},
              {"name": "AWS_COGNITO_CLIENT_ID", "value": "${{ secrets.AWS_COGNITO_CLIENT_ID }}"},
              {"name": "AWS_S3_BUCKET", "value": "${{ secrets.AWS_S3_BUCKET }}"},
              {"name": "AWS_S3_REGION", "value": "${{ env.AWS_REGION }}"},
              {"name": "AWS_CLOUDFRONT_DOMAIN", "value": "${{ secrets.AWS_CLOUDFRONT_DOMAIN }}"},
              {"name": "AWS_SES_REGION", "value": "${{ env.AWS_REGION }}"},
              {"name": "CORS_ORIGIN", "value": "${{ secrets.CORS_ORIGIN }}"}
            ]

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Deployment Summary

          | Property | Value |
          |----------|-------|
          | Environment | \`${{ inputs.environment }}\` |
          | Service | \`${{ inputs.service_name }}\` |
          | Image Tag | \`${{ steps.meta.outputs.image_tag }}\` |
          | Service URL | ${{ steps.deploy-ecs.outputs.service-url }} |
          | CPU | ${{ inputs.cpu }} units |
          | Memory | ${{ inputs.memory }} MB |
          | Commit | \`${{ github.sha }}\` |
          | Triggered by | @${{ github.actor }} |

          ### Health Check
          - **Path:** \`/api/health\`
          - **Port:** 8080
          EOF
