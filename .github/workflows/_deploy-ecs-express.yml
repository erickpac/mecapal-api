name: Deploy to ECS Express Mode

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (development/production)'
        required: true
        type: string
      service_name:
        description: 'ECS Express service name'
        required: true
        type: string
      ecr_repository:
        description: 'ECR repository name'
        required: true
        type: string
      node_env:
        description: 'NODE_ENV value'
        required: true
        type: string
      cpu:
        description: 'CPU units (256-16384)'
        required: false
        type: string
        default: '512'
      memory:
        description: 'Memory in MB'
        required: false
        type: string
        default: '1024'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      ECS_EXECUTION_ROLE_ARN:
        required: true
      ECS_INFRASTRUCTURE_ROLE_ARN:
        required: true
      ECS_TASK_ROLE_ARN:
        required: true
      DATABASE_URL:
        required: true
      AWS_COGNITO_USER_POOL_ID:
        required: true
      AWS_COGNITO_CLIENT_ID:
        required: true
      AWS_S3_BUCKET:
        required: true
      CORS_ORIGIN:
        required: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    outputs:
      service_url: ${{ steps.deploy-ecs.outputs.service-url }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "::group::Running Prisma migrations"
          pnpm prisma migrate deploy
          echo "::endgroup::"
          echo "::notice::Migrations applied successfully"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_TAG="${{ github.sha }}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "full_image=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS Express Mode
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ inputs.service_name }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.meta.outputs.image_tag }}
          execution-role-arn: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
          task-role-arn: ${{ secrets.ECS_TASK_ROLE_ARN }}
          container-port: 8080
          health-check-path: /api/health
          cpu: ${{ inputs.cpu }}
          memory: ${{ inputs.memory }}
          environment-variables: |
            NODE_ENV=${{ inputs.node_env }}
            PORT=8080
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AWS_REGION=${{ env.AWS_REGION }}
            AWS_COGNITO_USER_POOL_ID=${{ secrets.AWS_COGNITO_USER_POOL_ID }}
            AWS_COGNITO_CLIENT_ID=${{ secrets.AWS_COGNITO_CLIENT_ID }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            AWS_S3_REGION=${{ env.AWS_REGION }}
            AWS_SES_REGION=${{ env.AWS_REGION }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Deployment Summary

          | Property | Value |
          |----------|-------|
          | Environment | \`${{ inputs.environment }}\` |
          | Service | \`${{ inputs.service_name }}\` |
          | Image Tag | \`${{ steps.meta.outputs.image_tag }}\` |
          | Service URL | ${{ steps.deploy-ecs.outputs.service-url }} |
          | CPU | ${{ inputs.cpu }} units |
          | Memory | ${{ inputs.memory }} MB |
          | Commit | \`${{ github.sha }}\` |
          | Triggered by | @${{ github.actor }} |

          ### Health Check
          - **Path:** \`/api/health\`
          - **Port:** 8080
          EOF
